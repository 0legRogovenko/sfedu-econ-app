name: Import validated schedule snapshot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-beta-data-sync
  cancel-in-progress: false

jobs:
  import-snapshot:
    name: import reviewed official schedule snapshot
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: backend-beta
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      ADMIN_PASSWORD: not-used-by-sync
      SECRET_KEY: not-used-by-sync
      ADMIN_ENABLED: "0"
      ENABLE_SCHEDULER: "0"
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Require the Neon connection secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [[ -z "$DATABASE_URL" ]]; then
            echo "::error::DATABASE_URL is not configured in backend-beta"
            exit 1
          fi

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: alembic upgrade head

      - name: Import reviewed official schedule snapshot
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m src.schedule.validated_snapshot
