name: Official teacher photographs

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-beta-data-sync
  cancel-in-progress: false

jobs:
  photos:
    name: import reviewed portrait metadata only
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: backend-beta
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      ADMIN_PASSWORD: not-used-by-photo-import
      SECRET_KEY: not-used-by-photo-import
      ADMIN_ENABLED: "0"
      ENABLE_SCHEDULER: "0"
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Apply additive schema migration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [[ -z "$DATABASE_URL" ]]; then
            echo "::error::DATABASE_URL is not configured in backend-beta"
            exit 1
          fi
          alembic upgrade head
      - name: Update portrait metadata without changing people or schedules
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: >-
          python -m src.persons.photo_import data/person_photos/2026-11-24.json
          --apply --report portrait-coverage.json
      - uses: actions/upload-artifact@v4
        with:
          name: portrait-coverage-${{ github.run_number }}
          path: backend/portrait-coverage.json
          if-no-files-found: error
          retention-days: 7
