services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sfedu
      POSTGRES_PASSWORD: sfedu
      POSTGRES_DB: sfedu_econ
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sfedu -d sfedu_econ"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://sfedu:sfedu@db:5432/sfedu_econ
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
