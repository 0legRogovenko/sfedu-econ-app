[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [
  "migrations/versions",
  "tests/fixtures",
  "src/schedule/importer.py",
  "src/schedule/reviewed_schedule.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
